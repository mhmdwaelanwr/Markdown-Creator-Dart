name: Repository Health

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject local, generated, signing, and service-secret files
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)(\.dart_tool|build|\.idea|xcuserdata)/|(^|/)(\.env($|\.)|local\.properties$|key\.properties$|google-services\.json$|GoogleService-Info\.plist$)|\.(jks|keystore|p12|pfx|mobileprovision)$' || true)"
          if [ -n "$tracked" ]; then
            echo "Unexpected local/generated/private files are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Scan tracked text for common secret patterns
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          patterns = {
              'Google API key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'),
              'OpenAI-style secret': re.compile(r'sk-[A-Za-z0-9_-]{20,}'),
              'Private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'GIPHY-looking key in service code': re.compile(r'(?i)(?:api[_-]?key|giphy)[^\n]{0,80}[=:]\s*[\"\'][A-Za-z0-9_-]{24,}[\"\']'),
          }

          findings = []
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for name in files:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f'{label}: {name}')

          if findings:
              raise SystemExit('Potential secrets detected:\n' + '\n'.join(findings))

          print('Repository health checks passed.')
          PY
